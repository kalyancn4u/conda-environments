# Regenerate per-platform conda-lock lockfiles and open a PR with the result.
#
# The solver job runs INSIDE the conda-forge Miniforge container (mamba
# preinstalled) on the free `ubuntu-latest` runner — the same image the
# test-environments workflow and the local scripts use, for a consistent
# toolchain. Manual runs default to linux-64 (fast quick-reference); the weekly
# schedule locks all supported platforms. Lockfiles are also uploaded as build
# artifacts, so you get them even if PR creation is restricted by repo settings.
name: update-lockfiles

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Space-separated platforms to lock (linux-64, win-64, osx-arm64)"
        default: "linux-64"
        required: false
  schedule:
    # Every Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  lock:
    name: conda-lock ${{ matrix.env }}
    runs-on: ubuntu-latest
    container: condaforge/miniforge3:latest
    strategy:
      fail-fast: false
      matrix:
        # 98-legacy is documentation-only and intentionally not locked.
        env:
          - 01-core
          - 02-ml
          - 03-deep-learning
          - 04-web
          - 05-tools
          - 06-tensorflow
          - 07-geospatial
          - 08-timeseries

    defaults:
      run:
        shell: bash -el {0}

    steps:
      # The Miniforge image ships without git, which checkout needs in-container.
      - name: Install git (required by checkout inside the container)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install conda-lock
        run: mamba install --yes conda-lock

      - name: Generate lockfiles
        run: |
          set -uo pipefail
          src="python/3.12/environments/${{ matrix.env }}.yml"

          # Manual dispatch supplies platforms; schedule falls back to all three.
          platforms="${{ github.event.inputs.platforms }}"
          [ -z "$platforms" ] && platforms="linux-64 win-64 osx-arm64"
          echo "Locking ${{ matrix.env }} for: $platforms"

          for p in $platforms; do
            # TensorFlow has no conda-forge win-64 build.
            if [[ "${{ matrix.env }}" == "06-tensorflow" && "$p" == "win-64" ]]; then
              echo "::notice::skipping tensorflow on win-64 (no conda-forge build)"
              continue
            fi
            mkdir -p "python/3.12/lockfiles/$p"
            rm -f "conda-$p.lock"
            # Use conda-lock's default output name, then move it into place.
            if conda-lock lock --file "$src" --platform "$p" --kind explicit; then
              mv -f "conda-$p.lock" "python/3.12/lockfiles/$p/${{ matrix.env }}.conda.lock"
              n=$(grep -c '^https' "python/3.12/lockfiles/$p/${{ matrix.env }}.conda.lock" || true)
              echo "::notice::wrote lockfiles/$p/${{ matrix.env }}.conda.lock ($n packages)"
            else
              echo "::warning::conda-lock failed for ${{ matrix.env }} on $p"
            fi
          done

      - name: Upload lockfiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles-${{ matrix.env }}
          path: python/3.12/lockfiles/**/${{ matrix.env }}.conda.lock
          if-no-files-found: warn

  open-pr:
    name: Open PR with refreshed lockfiles
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all lockfile artifacts
        uses: actions/download-artifact@v4
        with:
          path: python/3.12/lockfiles
          merge-multiple: true

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-lockfiles
          title: "chore: refresh conda-lock lockfiles"
          commit-message: "chore: refresh conda-lock lockfiles"
          body: |
            Automated lockfile refresh from the `update-lockfiles` workflow.

            Review the version deltas before merging. See
            `docs/upgrade-strategy.md` for the intent-vs-lock model.
          add-paths: |
            python/3.12/lockfiles/**
