# Validate environment/template YAML: well-formedness + repo conventions.
# Fast, dependency-light gate that runs on every push and PR.
name: validate

on:
  push:
    paths:
      - "python/**/*.yml"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "python/**/*.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML syntax & conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Validate every environment & template YAML
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            python - "$f" <<'PY'
          import sys, yaml
          path = sys.argv[1]
          doc = yaml.safe_load(open(path, encoding="utf-8"))

          errors = []
          # 1) Must define a name and dependencies.
          if not isinstance(doc, dict):
              errors.append("top-level document is not a mapping")
          else:
              if not doc.get("name"):
                  errors.append("missing `name:`")
              deps = doc.get("dependencies")
              if not isinstance(deps, list) or not deps:
                  errors.append("missing or empty `dependencies:`")

              # 2) conda-forge must be the ONLY channel (nvidia/defaults banned).
              channels = doc.get("channels") or []
              if channels != ["conda-forge"]:
                  errors.append(f"channels must be exactly [conda-forge], got {channels}")

              # 3) Must pin the Python line.
              flat = [d for d in (deps or []) if isinstance(d, str)]
              if not any(d.split("=")[0].strip() == "python" for d in flat):
                  errors.append("no `python=` pin found")

          if errors:
              print("INVALID:", path)
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          print("ok:", path)
          PY
            rc=$?
            echo "::endgroup::"
            [[ $rc -ne 0 ]] && fail=1
          done < <(find python -name '*.yml' -print0)
          exit $fail
