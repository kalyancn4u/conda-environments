# Build each environment on Linux and verify it imports.
#
# Runs INSIDE the conda-forge Miniforge container (mamba preinstalled) on the
# free `ubuntu-latest` runner. We deliberately test Linux only:
#   * Public repos get unlimited free Linux minutes.
#   * Private repos bill Linux ×1 vs Windows ×2 / macOS ×10 against the free quota.
# The intended cross-platform support (win-64 / osx-arm64) is documented in
# docs/compatibility.md; Linux is the CI proof-of-solvability.
name: test-environments

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/test-environments.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/test-environments.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-environments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-and-verify:
    name: ${{ matrix.env }} (linux-64)
    runs-on: ubuntu-latest
    container: condaforge/miniforge3:latest
    strategy:
      fail-fast: false
      matrix:
        # 98-legacy is documentation-only and intentionally not built.
        env: [core, ml, dl, web, tools, tf, geo, ts]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      # The Miniforge image is minimal: it lacks `git` (needed by actions/checkout
      # in-container) and the system OpenGL/glib libs that `opencv` (cv2) loads at
      # import time in the headless deep-learning environments.
      - name: Install system deps (git for checkout; libGL for opencv)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git libgl1 libglib2.0-0
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Resolve environment file & name
        id: resolve
        run: |
          set -euo pipefail
          case "${{ matrix.env }}" in
            core)  file=01-core.yml;          name=py312-core;  key=core ;;
            ml)    file=02-ml.yml;            name=py312-ml;    key=ml ;;
            dl)    file=03-deep-learning.yml; name=py312-dl;    key=dl ;;
            web)   file=04-web.yml;           name=py312-web;   key=web ;;
            tools) file=05-tools.yml;         name=py312-tools; key=tools ;;
            tf)    file=06-tensorflow.yml;    name=py312-tf;    key=tf ;;
            geo)   file=07-geospatial.yml;    name=py312-geo;   key=geo ;;
            ts)    file=08-timeseries.yml;    name=py312-ts;    key=ts ;;
            *) echo "unknown env ${{ matrix.env }}"; exit 1 ;;
          esac
          echo "file=python/3.12/environments/$file" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "key=$key"   >> "$GITHUB_OUTPUT"

      - name: Create environment (mamba)
        run: mamba env create --yes --file "${{ steps.resolve.outputs.file }}"

      - name: Verify imports
        run: >
          conda run --no-capture-output -n "${{ steps.resolve.outputs.name }}"
          python python/3.12/scripts/verify-env.py --env "${{ steps.resolve.outputs.key }}"

      - name: Check for conda/pip package clashes
        env:
          ENV_NAME: ${{ steps.resolve.outputs.name }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          name = os.environ["ENV_NAME"]
          data = json.loads(subprocess.check_output(["conda", "list", "-n", name, "--json"]))
          pip_pkgs   = {p["name"].lower() for p in data if p.get("channel") == "pypi"}
          conda_pkgs = {p["name"].lower() for p in data if p.get("channel") != "pypi"}
          clash = sorted(pip_pkgs & conda_pkgs)
          if clash:
              print("conda/pip clash detected:", clash)
              sys.exit(1)
          print("no conda/pip clashes")
          PY
