# =============================================================================
# 03-deep-learning.yml  —  "py312-dl"  —  PyTorch deep-learning stack
# -----------------------------------------------------------------------------
# PyTorch + Lightning + the Hugging Face ecosystem, plus vision/NLP tooling and
# model-interchange formats. TensorFlow is deliberately kept OUT of this file
# (see 06-tensorflow.yml) so the two frameworks never fight over shared
# dependencies (protobuf, numpy, abseil, CUDA, ...).
#
# GPU: these are CPU builds and portable across Linux/Windows/Apple Silicon.
#      For CUDA-enabled PyTorch see docs/compatibility.md#cuda-installation-strategy.
# =============================================================================
name: py312-dl
channels:
  - conda-forge
dependencies:
  - python=3.12.*

  # --- PyTorch core (CPU) ---------------------------------------------------
  # conda-forge ships CPU builds by default. To force CPU explicitly you may use
  # `pytorch=*=cpu*`; we leave it unpinned so the solver stays flexible.
  - pytorch
  - torchaudio
  - torchvision
  - lightning             # high-level training loops (formerly pytorch-lightning)

  # --- Hugging Face ecosystem ----------------------------------------------
  - accelerate
  - datasets
  - huggingface_hub
  - safetensors
  - sentence-transformers
  - tokenizers
  - transformers          # modern 4.x — replaces the 2.1.1 found in the source env

  # --- Vision & NLP tooling -------------------------------------------------
  # NOTE: `albumentations` is intentionally NOT here. Its conda-forge build pulls
  # `albucore`, which hard-imports `simsimd`; that dependency is not reliably
  # provided on conda-forge, so `import albumentations` fails. Installing it via
  # pip would drag in `opencv-python-headless` and clash with conda `opencv`.
  # If you need it, add it in a project-specific venv: `pip install albumentations`.
  - opencv                # provides `cv2`
  - pillow
  - spacy
  - timm                  # PyTorch image models

  # --- Model interchange & monitoring --------------------------------------
  - onnx
  - onnxruntime           # CPU inference runtime
  - tensorboard           # usable standalone; not a TF dependency here

  - pip
