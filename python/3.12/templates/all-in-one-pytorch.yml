# =============================================================================
# template: all-in-one-pytorch  —  "py312-all-pytorch"  —  kitchen sink (PyTorch)
# -----------------------------------------------------------------------------
# One environment with (almost) everything, using **PyTorch** as the deep-learning
# framework. Paired with all-in-one-tflow.yml (the TensorFlow variant).
#
# WHY TWO ALL-IN-ONE FILES?
#   TensorFlow and PyTorch pin protobuf / abseil / numpy in mutually incompatible
#   ways, so a single environment cannot reliably contain both. Each all-in-one
#   therefore commits to ONE framework:
#     • this file            → PyTorch (torch, lightning, transformers, timm, …)
#     • all-in-one-tflow.yml  → TensorFlow (tensorflow, keras, …)
#   Everything else (core, classical ML, web, tools, geospatial, time series) is
#   identical between the two variants.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ READ BEFORE USING — this is the environment MOST LIKELY to hit dependency  │
# │ conflicts and to solve slowly. Prefer the modular environments for daily   │
# │ and reproducible/production work; treat this as a scratch/exploration env  │
# │ and LOCK IT once it works (scripts/export-env.sh or a conda-lock lockfile).│
# │ `gunicorn` is omitted (POSIX-only); `uvicorn` is included.                 │
# └───────────────────────────────────────────────────────────────────────────┘
# CPU-only, conda-forge only. GPU: see docs/compatibility.md.
# =============================================================================
name: py312-all-pytorch
