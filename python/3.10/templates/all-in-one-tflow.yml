# =============================================================================
# template: all-in-one-tflow  —  "py310-all-tflow"  —  kitchen sink (TensorFlow)
# -----------------------------------------------------------------------------
# One environment with (almost) everything, using **TensorFlow / Keras** as the
# deep-learning framework. Paired with all-in-one-pytorch.yml (the PyTorch variant).
#
# WHY TWO ALL-IN-ONE FILES?
#   TensorFlow and PyTorch pin protobuf / abseil / numpy in mutually incompatible
#   ways, so a single environment cannot reliably contain both. Each all-in-one
#   therefore commits to ONE framework:
#     • all-in-one-pytorch.yml → PyTorch (torch, lightning, timm, …)
#     • this file              → TensorFlow (tensorflow, keras, tensorboard, …)
#   PyTorch-only packages (lightning, timm, sentence-transformers, accelerate) are
#   dropped here; framework-agnostic tooling (transformers, datasets, opencv,
#   spacy, onnx…) is kept. Everything else (core, classical ML, web, tools,
#   geospatial, time series) is identical between the two variants.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ PLATFORM: conda-forge has NO win-64 TensorFlow build. On Windows, create   │
# │ this env WITHOUT the conda `tensorflow`/`keras`/`tensorboard` lines and     │
# │ `pip install "tensorflow>=2.19"` instead (see docs/compatibility.md).      │
# │ READ BEFORE USING — heavy, conflict-prone, slow to solve. Prefer the       │
# │ modular environments; treat this as a scratch env and LOCK IT once it works.│
# │ `gunicorn` is omitted (POSIX-only); `uvicorn` is included.                 │
# └───────────────────────────────────────────────────────────────────────────┘
# CPU-only, conda-forge only. GPU: see docs/compatibility.md.
# =============================================================================
name: py310-all-tflow
channels:
  - conda-forge
dependencies:
  - python=3.10.*

  # --- Core scientific stack (from 01-core) --------------------------------
  - beautifulsoup4
  - duckdb
  - httpx
  - ipykernel
  - ipywidgets
  - jupyterlab
  - lxml
  - matplotlib
  - notebook
  - numpy
  - openpyxl
  - pandas
  - plotly
  - polars
  - pyarrow
  - python-dotenv
  - pyyaml
  - requests
  - rich
  - scikit-learn
  - scipy
  - seaborn
  - sqlalchemy
  - statsmodels
  - tqdm
  - xlrd

  # --- Classical ML (from 02-ml) -------------------------------------------
  - catboost
  - category_encoders
  - eli5
  - feature_engine       # conda-forge name; PyPI/pip name is "feature-engine"
  - hdbscan
  - imbalanced-learn
  - lightgbm
  - mlflow
  - mlxtend
  - optuna
  - shap
  - skops
  - umap-learn
  - xgboost

  # --- Deep learning: TensorFlow + framework-agnostic tooling --------------
  # (torch-only packages intentionally excluded — see header)
  # (albumentations omitted — conda-forge build is broken via albucore->simsimd)
  - datasets
  - huggingface_hub
  - keras
  - onnx
  - onnxruntime
  - opencv
  - pillow
  - safetensors
  - spacy
  - tensorboard
  - tensorflow
  - tokenizers
  - transformers

  # --- Web & data apps (from 04-web; gunicorn omitted — POSIX-only) --------
  - alembic
  - celery
  - dash
  - django
  - fastapi
  - flask
  - gradio
  - pydantic
  - redis-py
  - streamlit
  - uvicorn

  # --- Developer tooling (from 05-tools) -----------------------------------
  - black
  - cookiecutter
  - coverage
  - docker-py
  - mypy
  - nox
  - pre-commit
  - pytest
  - pytest-cov
  - ruff
  - scrapy
  - selenium
  - tox

  # --- Geospatial (from 07-geospatial) -------------------------------------
  - contextily
  - fiona
  - folium
  - gdal
  - geoalchemy2
  - geopandas
  - mapclassify
  - pyproj
  - rasterio
  - shapely

  # --- Time series & forecasting (from 08-timeseries) ----------------------
  - cmdstanpy
  - prophet
  - ruptures
  - sktime
  - statsforecast

  - pip
  - pip:
      # conda-forge `playwright` is the driver, not the importable Python API.
      - playwright
